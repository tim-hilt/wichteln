{{if .Fixed}}<div class="row">
  <input type="hidden" name="name" value="{{.Name}}">
  <span>{{.Name}}</span>
  {{if .Me}}<span class="badge done">{{.T.me}}</span>{{end}}
</div>
{{else}}<div class="row">
  <input name="name" value="{{.Name}}" placeholder="{{.T.name}}" aria-label="{{.T.name}}">
  {{if .Me}}<input name="email" type="email" value="{{.Email}}" placeholder="{{.T.email}}" aria-label="{{.T.email}}">{{end}}
  {{if .Me}}<span class="badge done">{{.T.me}}</span>{{else}}<button type="button" class="secondary icon" aria-label="{{.T.remove}}" title="{{.T.remove}}" hx-on:click="this.closest('.row').remove()">✕</button>{{end}}
</div>
{{end}}
