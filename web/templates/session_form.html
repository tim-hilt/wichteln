{{template "header" .}}
    <h2>{{.T.participants}}</h2>
    {{range .Errors}}<p class="error" role="alert">{{.}}</p>{{end}}
    <form method="post" action="/session/{{.Hash}}">
      <div id="rows" class="participant-grid">
        <span class="label">{{.T.name}}</span><span class="label">{{.T.email}}</span><span></span>
        {{range .Rows}}{{template "participant_row.html" .}}{{end}}
      </div>
      <div class="actions">
        <button type="button" class="secondary" hx-get="/participant-row" hx-target="#rows" hx-swap="beforeend">+ {{.T.add_participant}}</button>
        <button>{{.T.submit_session}}</button>
      </div>
    </form>
{{template "footer" .}}
