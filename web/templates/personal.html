{{template "header" .}}
    <h2>{{printf .T.greeting .Name}}</h2>
    {{range .Errors}}<p class="error" role="alert">{{.}}</p>{{end}}
    {{if .Drawn}}
    <p class="success">🎁 {{printf .T.draw_gives_to .Recipient}}</p>
    <div class="field">
      <span class="label">{{.T.draw_wish}}</span>
      <blockquote>{{.RecipientsWish}}</blockquote>
    </div>
    {{else}}
    <form method="post">
      {{template "wish_fields" .}}
      <div class="actions"><button>{{.T.submit_wish}}</button></div>
    </form>
    {{end}}
{{template "footer" .}}
