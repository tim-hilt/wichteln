<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.T.title}}</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/htmx.min.js"></script>
</head>
<body>
  <main>
    <h1>{{.T.title}}</h1>
    <form method="post" action="/new"><button>{{.T.create}}</button></form>
    <form method="post" action="/open-session">
      <label>{{.T.open_session}} <input name="hash" required placeholder="{{.T.session_hash}}"></label>
      <button>{{.T.go}}</button>
    </form>
    <form method="post" action="/open-link">
      <label>{{.T.open_link}} <input name="hash" required placeholder="{{.T.link_hash}}"></label>
      <button>{{.T.go}}</button>
    </form>
  </main>
</body>
</html>
