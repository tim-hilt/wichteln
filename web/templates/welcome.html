{{template "header" .}}
    <form method="post" action="/new"><button>{{.T.create}}</button></form>
    <hr>
    {{range .Forms}}
    <form method="post" action="/{{.ID}}">
      <div class="field">
        <label for="{{.ID}}">{{index $.T .Label}}</label>
        <div class="inline">
          <input id="{{.ID}}" name="hash" required placeholder="{{index $.T .Placeholder}}"{{if .Error}} value="{{.Input}}"{{end}}>
          <button class="secondary">{{$.T.go}}</button>
        </div>
        {{if .Error}}<p class="error" role="alert">{{.Error}}</p>{{end}}
      </div>
    </form>
    {{end}}
{{template "footer" .}}
