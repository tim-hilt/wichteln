{{template "header" .}}
    <form method="post" action="/new"><button>{{.T.create}}</button></form>
    <form method="post" action="/open-session">
      <label>{{.T.open_session}} <input name="hash" required placeholder="{{.T.session_hash}}"></label>
      <button>{{.T.go}}</button>
    </form>
    <form method="post" action="/open-link">
      <label>{{.T.open_link}} <input name="hash" required placeholder="{{.T.link_hash}}"></label>
      <button>{{.T.go}}</button>
    </form>
{{template "footer" .}}
