{{template "header" .}}
    {{if eq .Session.State "Drawn"}}
    <p>{{.T.drawn}}</p>
    {{else}}
    {{range .Errors}}<p class="error" role="alert">{{.}}</p>{{end}}
    <table>
      {{range .Session.Participants}}
      <tr>
        <td>{{.Name}}</td>
        <td>
          <form method="post" action="/session/{{$.Session.Hash}}/email">
            <input type="hidden" name="participant" value="{{.Name}}">
            <input type="email" name="email" value="{{.Email}}" required>
            <button>{{$.T.save_email}}</button>
          </form>
        </td>
        <td>{{if .Submitted}}{{$.T.status_submitted}}{{else}}{{$.T.status_pending}}{{end}}</td>
        <td>
          <form method="post" action="/session/{{$.Session.Hash}}/resend">
            <input type="hidden" name="participant" value="{{.Name}}">
            <button>{{$.T.resend}}</button>
          </form>
        </td>
      </tr>
      {{end}}
    </table>
    {{end}}
{{template "footer" .}}
